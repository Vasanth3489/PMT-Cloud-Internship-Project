{% extends "base.html" %}{% block title %}Project{% endblock %}{% block content %}
<div class="pagehead"><div><h1>{{"Edit Project" if project else "Create Project"}}</h1><p>Define scope, timeline and team.</p></div></div>
<div class="panel formpanel"><form method="post"><div class="formgrid"><div><label>Project Name</label><input name="name" value="{{project.name if project else ''}}" required></div><div><label>Status</label><select name="status">{% for x in ["Planning","Active","On Hold","Completed"] %}<option {% if project and project.status==x %}selected{% endif %}>{{x}}</option>{% endfor %}</select></div><div><label>Priority</label><select name="priority">{% for x in ["Low","Medium","High","Critical"] %}<option {% if project and project.priority==x %}selected{% endif %}>{{x}}</option>{% endfor %}</select></div><div><label>Team Lead</label><select name="team_lead"><option value="">Select</option>{% for u in members %}{% if u.role in ["Team Lead","Project Manager"] %}<option value="{{u._id}}" {% if project and project.team_lead==u._id|string %}selected{% endif %}>{{u.name}} ({{u.role}})</option>{% endif %}{% endfor %}</select></div><div><label>Start Date</label><input type="date" name="start_date" value="{{project.start_date if project else ''}}"></div><div><label>Due Date</label><input type="date" name="due_date" value="{{project.due_date if project else ''}}"></div></div><label>Description</label><textarea name="description">{{project.description if project else ''}}</textarea><label>Team Members</label><select name="member_ids" multiple class="multi">{% for u in members %}<option value="{{u._id}}" {% if project and u._id|string in project.member_ids %}selected{% endif %}>{{u.name}} — {{u.role}}</option>{% endfor %}</select><button class="primary">Save Project</button></form></div>{% endblock %}
