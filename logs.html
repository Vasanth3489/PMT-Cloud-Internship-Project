{% extends "base.html" %}{% block title %}Activity Logs{% endblock %}{% block content %}
<div class="pagehead"><div><h1>Activity Logs</h1><p>Audit trail of important system actions.</p></div></div><div class="panel tablewrap"><table><tr><th>Date</th><th>User</th><th>Action</th><th>Details</th></tr>{% for x in logs %}<tr><td>{{x.created_at.strftime("%d-%m-%Y %H:%M")}}</td><td>{{x.user_name}}</td><td>{{x.action}}</td><td>{{x.detail}}</td></tr>{% endfor %}</table></div>{% endblock %}
